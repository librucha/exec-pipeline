# Visit https://goreleaser.com for documentation on how to customize this
# behavior.

version: 2

project_name: exec-pipeline
builds:
  - env:
      - CGO_ENABLED=0
    tags:
      - '{{ .ProjectName }}_{{ .Version }}'
    mod_timestamp: '{{ .CommitTimestamp }}'
    flags:
      - -trimpath
    ldflags:
      - '-s -w -X main.Version={{.Version}} -X main.Commit={{.ShortCommit}} -X main.Date={{.CommitTimestamp}}'
    goos:
      - windows
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    binary: '{{ .ProjectName }}_v{{ .Version }}'
archives:
  - formats: ['zip', 'tar.gz']
    name_template: '{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}'
checksum:
  name_template: '{{ .ProjectName }}_{{ .Version }}_SHA256SUMS'
  algorithm: sha256
release:
  github:
    owner: librucha
    name: https://github.com/librucha/exec-pipeline
changelog:
  use: git